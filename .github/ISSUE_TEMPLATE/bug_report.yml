name: Bug report
description: Something in Building Icon Generator does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The log file is the most useful part of a report: please attach it.

  - type: input
    id: game-version
    attributes:
      label: Game version
      description: Shown at the bottom right of the launcher and of the main menu.
      placeholder: "1.6.2f1"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Building Icon Generator version
      description: Shown on the mod's Paradox Mods page and in the game's mod list.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and the steps that lead to it.
      placeholder: |
        1. Started the game with ...
        2. Opened ...
        3. The icon of ... looks ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: dropdown
    id: game-icons
    attributes:
      label: "Option: Use the generated icons in the game"
      options:
        - "Off"
        - Zoned and signature buildings
        - All buildings
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log file
      description: |
        Drag the file here. It is in the game's user-data folder:
        %USERPROFILE%\AppData\LocalLow\Colossal Order\Cities Skylines II\Logs\BuildingIconGenerator.log
        If the problem is a crash or the game does not start, please add Player.log from the folder above Logs as well.
      placeholder: Drop BuildingIconGenerator.log here.
    validations:
      required: true

  - type: textarea
    id: building
    attributes:
      label: Affected buildings
      description: For a wrong or missing icon, the building's name (the name of its PNG file) and the mod or content pack it comes from. A screenshot of the icon helps.
    validations:
      required: false

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods
      description: The other code mods you use, if the problem may come from an interaction with one of them.
    validations:
      required: false
